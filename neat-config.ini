# NEAT config for the curriculum run. Base: the wind project's neat-config-k.ini (Stanley & Miikkulainen 2002).
# Every genome starts as a copy of the cloned teacher network (13 inputs -> 24 tanh hidden -> 4), with small
# weight noise (train.py --seed-noise). The 24 seed hidden nodes are protected from deletion (lander/neatnet.py).
# Mutations are gentler than stock (was: rate 0.8, power 0.5), so one mutation doesn't wreck a trained network.
# Attempt D: 15 inputs (2 route sensors), power 0.1 -> 0.05 (noise 0.05 on the clone cost ~10 points with the boulder).

[NEAT]
fitness_criterion     = max
fitness_threshold     = 100000
no_fitness_termination = True
pop_size              = 120
reset_on_extinction   = False

[SeededGenome]
num_inputs              = 15
num_outputs             = 4
num_hidden              = 0
feed_forward            = True
initial_connection      = full_direct

activation_default      = tanh
activation_mutate_rate  = 0.0
activation_options      = tanh
aggregation_default     = sum
aggregation_mutate_rate = 0.0
aggregation_options     = sum

bias_init_mean          = 0.0
bias_init_stdev         = 0.3
bias_max_value          = 30.0
bias_min_value          = -30.0
bias_mutate_power       = 0.05
bias_mutate_rate        = 0.4
bias_replace_rate       = 0.005

response_init_mean      = 1.0
response_init_stdev     = 0.0
response_max_value      = 30.0
response_min_value      = -30.0
response_mutate_power   = 0.0
response_mutate_rate    = 0.0
response_replace_rate   = 0.0

weight_init_mean        = 0.0
weight_init_stdev       = 0.3
weight_max_value        = 30.0
weight_min_value        = -30.0
weight_mutate_power     = 0.05
weight_mutate_rate      = 0.4
weight_replace_rate     = 0.005

# new connections start small (init stdev 0.3) so they nudge rather than override
node_add_prob           = 0.03
node_delete_prob        = 0.03
conn_add_prob           = 0.15
conn_delete_prob        = 0.05
enabled_default         = True
enabled_mutate_rate     = 0.005

compatibility_disjoint_coefficient = 1.0
compatibility_weight_coefficient   = 0.5

[DefaultSpeciesSet]
compatibility_threshold = 0.6

[DefaultStagnation]
species_fitness_func = max
max_stagnation       = 40
species_elitism      = 2

[DefaultReproduction]
elitism            = 3
survival_threshold = 0.25
min_species_size   = 2
